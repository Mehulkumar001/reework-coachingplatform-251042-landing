<!-- Wrapper: full-width background -->
<div class="w-full">
    <section class="relative overflow-hidden min-h-[400px] md:min-h-[500px] lg:h-[600px]"
        style="background-color: rgb(31, 104, 97);">
        <div
            class="max-w-7xl mx-auto h-full min-h-[400px] md:min-h-[500px] lg:min-h-[600px] relative px-4 desktop:px-[60px]">
            <!-- Content -->
            <div
                class="relative md:absolute md:left-4 md:top-[60%] md:-translate-y-1/2 w-full md:w-1/2 z-10 py-12 md:py-0 pt-28 pb-12 md:pt-0 md:pb-0">
                <h2 class="go-digital-banner-title mb-4 md:mb-6 tracking-wide md:tracking-[3.5px] text-[28px] sm:text-[40px] md:text-[55px]"
                    style="font-family: 'Rethink Sans'; color: #ffffff; text-shadow: none; line-height: 1.3; font-style: normal; text-decoration: none; font-weight: 600; text-transform: uppercase;">
                    <span class="block">Go digital at no cost</span>
                    <span class="block">and earn more</span>
                </h2>
                <p class="go-digital-banner-subtitle mb-6 md:mb-8 tracking-wide text-[16px] sm:text-[20px] md:text-[23px]"
                    style="font-family: 'Rethink Sans'; color: #ffffff; text-transform: none;">
                    Start your journey as a ReeCoach today!
                </p>
                <a [href]="reecoachApplicationUrl" target="_blank"
                    class="inline-block bg-[#47CBB6] px-6 py-2 md:px-10 md:py-2.5 rounded-sm font-bold uppercase tracking-wider md:tracking-widest hover:bg-[#3ab5a1] transition-colors shadow-lg cursor-pointer"
                    style="font-size: 16px; color: #000000;">
                    SIGN UP FOR FREE
                </a>
            </div>
        </div>

        <!-- Left top decorative image - placed a little down from top and in from left -->
        <div class="absolute top-12 left-0 md:top-14 z-0 pointer-events-none">
            <img src="/vectorImg-5.webp" alt="" class="max-w-[260px] md:max-w-[360px] h-auto scale-x-[-1]" />
        </div>

        <!-- Right Image - attached to section right edge and top/bottom -->
        <div class="absolute right-0 top-0 bottom-0 w-[32%] hidden lg:block">
            <img src="/GoDigitalImg.jpeg" alt="Go Digital" class="w-full h-full object-cover object-center" />
        </div>

    </section>
</div>
