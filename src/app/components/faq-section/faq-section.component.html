<section id="faqs" class="py-6 bg-white">
    <div class="max-w-6xl mx-auto px-4">
        <h2 class="text-center mb-8 ml-4"
            style="font-size: 35px !important; font-weight: 500 !important; color: #232323 !important; text-transform: none !important;">
            Frequently Asked Questions</h2>

        <div class="flex flex-wrap justify-start gap-10 mb-4">
            @for (tab of tabs; track tab) {
            <button (click)="setTab(tab)" class="px-5 py-2 rounded-none transition-all border-0"
                style="font-size: 18px !important; font-weight: 200 !important; text-transform: none !important;"
                [ngClass]="activeTab === tab ? 'bg-[#00D4AE] text-white' : 'bg-[#F0F0F0] text-black hover:bg-[#EAEAEA]'">
                {{ tab }}
            </button>
            }
        </div>

        <div class="bg-white">
            @for (faq of faqs; track $index) {
            <div>
                <button (click)="toggle($index)"
                    class="w-full flex justify-between items-center text-left px-5 py-4 gap-4 group border-b"
                    style="font-size: 20px !important; font-weight: 300 !important; color: #1F2124 !important; border-color: #E0E0E0;">
                    <span class="text-left"
                        style="font-size: 20px !important; font-weight: 300 !important; color: #1F2124 !important;">{{
                        faq.q }}</span>
                    <span class="flex-shrink-0 text-[#1F2124] transition-transform duration-200"
                        [class.rotate-180]="openIndex === $index">
                        <i-lucide [img]="ChevronDown" size="20"></i-lucide>
                    </span>
                </button>
                @if (openIndex === $index) {
                <div class="px-5 pb-5 pt-4"
                    style="font-size: 18px !important; font-weight: 300 !important; color: #333333 !important; line-height: 1.6;"
                    [innerHTML]="faq.a">
                </div>
                }
            </div>
            }
        </div>
    </div>
</section>
