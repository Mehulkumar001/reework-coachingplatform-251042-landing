@if (isLoading) {
    <div class="container mx-auto px-4 py-12 max-w-4xl text-gray-800">
        <div class="text-center">
            <p>Loading...</p>
        </div>
    </div>
} @else {
    <div class="container mx-auto px-4 py-12 max-w-4xl text-gray-800">
        <h1 class="text-3xl md:text-4xl font-bold mb-2">{{ title }}</h1>
        <div class="space-y-6 text-base leading-relaxed" [innerHTML]="content"></div>
    </div>
}
