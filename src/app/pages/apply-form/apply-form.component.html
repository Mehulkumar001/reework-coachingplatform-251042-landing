<div class="bg-gray-50 min-h-screen font-['Rethink_Sans']">
    <!-- Header Section -->
    <div class="bg-[#2D5A54] pt-12 pb-24 px-6 text-center relative overflow-hidden">
        <!-- Abstract Background Pattern -->
        <div class="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
            <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" class="w-full h-full text-white">
                <circle cx="10" cy="10" r="40" stroke-width="0.5" />
                <circle cx="90" cy="90" r="40" stroke-width="0.5" />
            </svg>
        </div>

        <div class="relative z-10 max-w-4xl mx-auto">
            <a routerLink="/open-positions"
                class="inline-flex items-center gap-2 text-emerald-200 font-bold mb-6 hover:text-white transition-colors text-sm uppercase tracking-wider">
                <i-lucide [img]="ArrowRight" class="transform rotate-180" size="16"></i-lucide> Back to Positions
            </a>
            <h1 class="text-3xl md:text-4xl font-black text-white uppercase tracking-wide mb-2">
                Join the Team
            </h1>
            <p class="text-emerald-100 text-lg text-center">
                Applying for <span class="text-white font-bold border-b-2 border-[#47CBB6]">{{selectedPosition}}</span>
            </p>
        </div>
    </div>

    <!-- Form Container -->
    <div class="max-w-2xl mx-auto px-6 -mt-16 pb-20 relative z-20">
        <div class="bg-white rounded-2xl shadow-[0_4px_20px_rgba(0,0,0,0.08)] p-8 md:p-10 border border-gray-100">
            <form class="space-y-6" (submit)="submitApplication($event)">
                <div class="grid md:grid-cols-2 gap-6">
                    <!-- Name -->
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wider ml-1">Full Name</label>
                        <input type="text" required placeholder="John Doe"
                            class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-[#47CBB6] focus:ring-2 focus:ring-[#47CBB6]/20 outline-none transition-all font-medium text-gray-700 placeholder:text-gray-400" />
                    </div>

                    <!-- Email -->
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wider ml-1">Email
                            Address</label>
                        <input type="email" required placeholder="john@example.com"
                            class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-[#47CBB6] focus:ring-2 focus:ring-[#47CBB6]/20 outline-none transition-all font-medium text-gray-700 placeholder:text-gray-400" />
                    </div>
                </div>

                <!-- Phone -->
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider ml-1">Phone Number</label>
                    <input type="tel" required placeholder="+91 98765 43210"
                        class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-[#47CBB6] focus:ring-2 focus:ring-[#47CBB6]/20 outline-none transition-all font-medium text-gray-700 placeholder:text-gray-400" />
                </div>

                <!-- Resume Upload -->
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider ml-1">Resume/CV</label>
                    <div class="relative group">
                        <input type="file" required
                            class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-[#47CBB6]/10 file:text-[#2D5A54] hover:file:bg-[#47CBB6]/20 text-sm text-gray-500 cursor-pointer transition-all group-hover:border-[#47CBB6]/50" />
                    </div>
                    <p class="text-[10px] text-gray-400 mt-1 ml-1 uppercase tracking-wide">PDF, DOC, DOCX up to 5MB</p>
                </div>

                <!-- Cover Letter -->
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider ml-1">Cover Letter
                        (Optional)</label>
                    <textarea rows="4" placeholder="Tell us why you're a great fit..."
                        class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-[#47CBB6] focus:ring-2 focus:ring-[#47CBB6]/20 outline-none transition-all font-medium text-gray-700 placeholder:text-gray-400 resize-none"></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                    class="w-full py-4 bg-[#2D5A54] text-white font-black uppercase tracking-widest rounded-lg hover:bg-[#1a3834] active:scale-[0.98] transition-all shadow-lg hover:shadow-xl hover:shadow-[#2D5A54]/20 flex items-center justify-center gap-2 group mt-4">
                    Submit Application
                    <i-lucide [img]="ArrowRight" size="20"
                        class="group-hover:translate-x-1 transition-transform"></i-lucide>
                </button>
            </form>
        </div>
    </div>
</div>
